name: Import Expr DSL source

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  import-source:
    if: github.event.issue.number == 2 && github.event.comment.body == '/import-expr-dsl'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/maven-project-setup
          fetch-depth: 0

      - name: Decode source project
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : > /tmp/payload.b64
          for part in $(seq -w 0 9); do
            gh api "repos/${{ github.repository }}/contents/.transport/part-$part?ref=agent/bootstrap-expr-dsl" --jq -r .content \
              | tr -d '\r\n' | base64 --decode >> /tmp/payload.b64
          done
          base64 --decode /tmp/payload.b64 > /tmp/expr-dsl.zip
          echo '183d1261c8427a24d92e067276699e86651e7a986efd0bc79249b1330f78e4d3  /tmp/expr-dsl.zip' | sha256sum -c -
          mkdir /tmp/expr-dsl
          unzip -q /tmp/expr-dsl.zip -d /tmp/expr-dsl
          rsync -a --delete --exclude .git /tmp/expr-dsl/ ./

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B -ntp clean verify

      - name: Commit source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Expr DSL Maven project'
          git push origin HEAD:agent/maven-project-setup
