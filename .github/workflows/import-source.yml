name: Import Expr DSL source

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  import-source:
    if: github.event.issue.number == 2 && github.event.comment.body == '/import-expr-dsl'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/maven-project-setup
          fetch-depth: 0

      - name: Decode source project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }} --jq .body \
            | base64 --decode > /tmp/expr-dsl.zip
          mkdir /tmp/expr-dsl
          unzip -q /tmp/expr-dsl.zip -d /tmp/expr-dsl
          rsync -a --delete --exclude .git /tmp/expr-dsl/ ./

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B -ntp clean verify

      - name: Commit source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Expr DSL Maven project'
          git push origin HEAD:agent/maven-project-setup
